apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-keys
  namespace: sanvi
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: llm-keys
  data:
    - secretKey: LLM_API_KEY
      remoteRef: { key: sanvi/llm, property: api_key }
    - secretKey: LITELLM_MASTER_KEY
      remoteRef: { key: sanvi/gateway, property: master_key }
