apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: sanvi
data:
  config.yaml: |
    model_list:
      - model_name: sanvi-mock
        litellm_params:
          model: openai/gpt-4o-mini
          api_key: os.environ/LLM_API_KEY
          mock_response: "Hello from the SanVi gateway (mock model, no cost)"
      - model_name: sanvi-smart
        litellm_params:
          model: anthropic/claude-sonnet-5-5
          api_key: os.environ/LLM_API_KEY
      - model_name: sanvi-fast
        litellm_params:
          model: anthropic/claude-haiku-5-5
          api_key: os.environ/LLM_API_KEY
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
