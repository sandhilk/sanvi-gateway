apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: sanvi
  labels: { app: litellm }
  annotations:
    # Checkov risk acceptances for the UPSTREAM LiteLLM image (risk R3 in THREAT_MODEL.md).
    # Metadata only: no effect on the running pods. Review: when hardening is tested on kind.
    checkov.io/skip1: CKV_K8S_20=Upstream image; hardening not yet tested (R3)
    checkov.io/skip2: CKV_K8S_22=LiteLLM writes to its filesystem at start; needs tested emptyDir mounts (R3)
    checkov.io/skip3: CKV_K8S_23=Upstream image user not yet verified as non-root (R3)
    checkov.io/skip4: CKV_K8S_28=Covered by dropping ALL capabilities once R3 is tested
    checkov.io/skip5: CKV_K8S_29=Pod securityContext to be added with R3
    checkov.io/skip6: CKV_K8S_30=Container securityContext to be added with R3
    checkov.io/skip7: CKV_K8S_31=seccomp RuntimeDefault to be added with R3
    checkov.io/skip8: CKV_K8S_37=Capabilities drop to be added with R3
    checkov.io/skip9: CKV_K8S_40=High UID to be set with R3
spec:
  replicas: 1
  selector:
    matchLabels: { app: litellm }
  template:
    metadata:
      labels: { app: litellm }
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-stable
          args: ["--config", "/app/config.yaml", "--port", "4000"]
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef: { name: llm-keys }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: sanvi-pg-app, key: uri }
          volumeMounts:
            - { name: config, mountPath: /app/config.yaml, subPath: config.yaml }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1536Mi }
          startupProbe:
            httpGet: { path: /health/liveliness, port: 4000 }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health/readiness, port: 4000 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/liveliness, port: 4000 }
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: config
          configMap: { name: litellm-config }
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: sanvi
spec:
  selector: { app: litellm }
  ports:
    - port: 4000
      targetPort: 4000
