name: compliance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Compliance evidence report (fails if any control fails)
        run: python3 scripts/compliance_report.py
      - name: Show report in the run summary
        if: always()
        run: cat evals/compliance-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compliance-report
          path: evals/compliance-report.*
