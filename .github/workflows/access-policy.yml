name: access-policy
on:
  pull_request:
    paths: ["access/**", "scripts/access_sync.py", ".github/workflows/access-policy.yml"]
  push:
    branches: [main]
    paths: ["access/**", "scripts/access_sync.py", ".github/workflows/access-policy.yml"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pyyaml
      - name: Validate access/teams.yaml against its policy
        run: python3 scripts/access_sync.py --validate
