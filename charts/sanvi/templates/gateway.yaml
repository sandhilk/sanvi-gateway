apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gateway
  labels: {{- include "sanvi.labels" . | nindent 4 }}
    app: {{ .Release.Name }}-gateway
  annotations:
    # Checkov risk acceptances for the upstream LiteLLM image (R3 in THREAT_MODEL.md). Metadata only.
    checkov.io/skip1: CKV_K8S_20=Upstream image; hardening not yet tested (R3)
    checkov.io/skip2: CKV_K8S_22=LiteLLM writes to its filesystem at start (R3)
    checkov.io/skip3: CKV_K8S_23=Upstream image user not yet verified as non-root (R3)
    checkov.io/skip4: CKV_K8S_28=Covered by dropping ALL capabilities once R3 is tested
    checkov.io/skip5: CKV_K8S_29=Pod securityContext to be added with R3
    checkov.io/skip6: CKV_K8S_30=Container securityContext to be added with R3
    checkov.io/skip7: CKV_K8S_31=seccomp RuntimeDefault to be added with R3
    checkov.io/skip8: CKV_K8S_37=Capabilities drop to be added with R3
    checkov.io/skip9: CKV_K8S_40=High UID to be set with R3
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels: { app: {{ .Release.Name }}-gateway }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-gateway }
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/litellm-config.yaml") . | sha256sum }}
    spec:
      containers:
        - name: gateway
          image: {{ .Values.gateway.image }}
          args: ["--config", "/app/config.yaml", "--port", "4000"]
          ports: [{ containerPort: 4000 }]
          envFrom:
            - secretRef: { name: {{ .Values.secrets.name }} }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: {{ include "sanvi.dbSecret" . }}, key: {{ include "sanvi.dbKey" . }} }
          volumeMounts:
            - { name: config, mountPath: /app/config.yaml, subPath: config.yaml }
          resources: {{- toYaml .Values.gateway.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
          startupProbe:
            httpGet: { path: /health/liveliness, port: 4000 }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health/readiness, port: 4000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/liveliness, port: 4000 }
            periodSeconds: 20
      volumes:
        - name: config
          configMap: { name: {{ .Release.Name }}-gateway-config }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gateway
  labels: {{- include "sanvi.labels" . | nindent 4 }}
spec:
  type: {{ .Values.gateway.service.type }}
  selector: { app: {{ .Release.Name }}-gateway }
  ports:
    - port: {{ .Values.gateway.service.port }}
      targetPort: 4000
