{{- if eq .Values.secrets.mode "externalSecret" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.name }}
  labels: {{- include "sanvi.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.externalSecret.storeName }}
    kind: {{ .Values.secrets.externalSecret.storeKind }}
  target:
    name: {{ .Values.secrets.name }}
  data:
    - secretKey: LLM_API_KEY
      remoteRef: {{- toYaml .Values.secrets.externalSecret.llmApiKey | nindent 8 }}
    - secretKey: LITELLM_MASTER_KEY
      remoteRef: {{- toYaml .Values.secrets.externalSecret.masterKey | nindent 8 }}
{{- end }}
