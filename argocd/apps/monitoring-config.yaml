apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: monitoring-config, namespace: argocd }
spec:
  project: default
  destination: { server: https://kubernetes.default.svc, namespace: monitoring }
  source: { repoURL: https://github.com/sandhilk/sanvi-gateway.git, targetRevision: main, path: apps/monitoring }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
