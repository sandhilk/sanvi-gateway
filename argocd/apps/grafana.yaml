apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: grafana, namespace: argocd }
spec:
  project: default
  destination: { server: https://kubernetes.default.svc, namespace: monitoring }
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: grafana
    targetRevision: 10.5.15
    helm:
      valuesObject:
        admin: { existingSecret: grafana-admin, userKey: admin-user, passwordKey: admin-password }
        persistence: { enabled: false }
        resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 384Mi } }
        envValueFrom:
          GF_DB_RO_PASSWORD: { secretKeyRef: { name: grafana-db, key: password } }
        sidecar:
          dashboards: { enabled: true, label: grafana_dashboard, labelValue: "1", searchNamespace: monitoring }
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: SanVi Postgres (read-only)
                uid: sanvi-pg
                type: grafana-postgresql-datasource
                url: sanvi-pg-rw.sanvi.svc:5432
                user: grafana_ro
                isDefault: true
                jsonData: { database: litellm, sslmode: require, postgresVersion: 1500 }
                secureJsonData: { password: "${GF_DB_RO_PASSWORD}" }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
