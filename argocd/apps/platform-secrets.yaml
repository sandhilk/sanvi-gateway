apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sandhilk/sanvi-gateway.git
    targetRevision: main
    path: platform/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, SkipDryRunOnMissingResource=true]
    retry:
      limit: 10
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }
